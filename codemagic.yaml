# =============================================================================
# codemagic.yaml — CI/CD Android (APK) pour l'app Expo "wallet"
# -----------------------------------------------------------------------------
# Stack détectée : Expo SDK 57 / React Native 0.86 (Continuous Native Generation).
#   - Les dossiers natifs ios/ et android/ ne sont PAS versionnés : ils sont
#     générés à la volée par `expo prebuild` pendant le build (voir plus bas).
#   - Gestionnaire de paquets : npm (package-lock.json présent).
#   - Package Android : com.alex20ng.wallet (défini dans app.json).
#
# Deux workflows sont fournis (aucun keystore requis) :
#   1) android-debug   -> APK de debug, signé automatiquement avec la clé debug.
#   2) android-release -> APK de release (optimisé), également signé avec la
#                         clé debug par défaut : installable immédiatement.
#                         Voir "POUR SIGNER EN RELEASE" en bas pour une vraie clé.
#
# -----------------------------------------------------------------------------
# CE QUE TU DOIS CONFIGURER DANS LE PANEL CODEMAGIC (UI)
# -----------------------------------------------------------------------------
# 1) Ajouter le dépôt Git comme application Codemagic, puis cliquer sur
#    "Check for configuration file" pour détecter ce codemagic.yaml.
#
# 2) Signer la release (OPTIONNEL, workflow android-release uniquement) :
#    Par défaut le build ne nécessite AUCUN keystore (voir "POUR SIGNER EN
#    RELEASE" en bas). Si tu veux une vraie signature de distribution :
#    Team settings > "codemagic.yaml settings" > "Code signing identities" >
#    onglet "Android keystores" > "Add keystore".
#      - Upload le fichier .keystore
#      - Renseigne : Keystore password, Key alias, Key password
#      - "Reference name" = wallet_keystore
#    Générer un keystore si tu n'en as pas :
#      keytool -genkey -v -keystore wallet.keystore -storetype JKS \
#        -keyalg RSA -keysize 2048 -validity 10000 -alias wallet
#
# 3) Variables d'environnement (optionnel) :
#    Codemagic UI > "Environment variables" : crée un groupe (ex: "wallet_env")
#    pour tes secrets (clés API, tokens...). Référence-le via `groups:` plus bas.
#    Ne JAMAIS mettre de secret en clair dans ce fichier.
#
# 4) Déclencher un build : bouton "Start new build" > choisis le workflow.
# =============================================================================

workflows:
  # ---------------------------------------------------------------------------
  # WORKFLOW 1 — APK de DEBUG (aucune signature à configurer)
  # ---------------------------------------------------------------------------
  android-debug:
    name: Wallet Android (Debug APK)
    max_build_duration: 60 # durée max du build en minutes
    instance_type: linux_x2 # machine Linux (moins chère ; pas besoin de macOS pour Android)

    environment:
      # --- Chaîne d'outils ---
      node: 22.14.0 # Node LTS requis par React Native 0.86
      java: 17 # JDK 17 requis par la build Android (AGP / Gradle 8)
      # groups:                            # Décommente et liste tes groupes de variables Codemagic
      #   - wallet_env
      vars:
        PACKAGE_NAME: "com.alex20ng.wallet" # doit correspondre à app.json > expo.android.package

    # Cache pour accélérer les builds suivants (deps npm + Gradle)
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      # 1) Installation des dépendances JS (npm ci = install reproductible depuis le lockfile)
      - name: Install npm dependencies
        script: npm ci

      # 2) Génération des projets natifs (dossier android/) depuis app.json + config plugins.
      #    --clean : repart d'un dossier propre ; --no-install : on a déjà installé les deps.
      - name: Expo Prebuild (generate android/)
        script: npx expo prebuild --platform android --clean --no-install

      # 3) Indique à Gradle où se trouve le SDK Android fourni par la machine Codemagic.
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      # 4) Compilation de l'APK debug (signé automatiquement avec debug.keystore).
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon

    # Fichiers récupérables en fin de build (onglet "Artifacts" / téléchargement).
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.apk

  # ---------------------------------------------------------------------------
  # WORKFLOW 2 — APK de RELEASE (aucun keystore requis par défaut)
  # ---------------------------------------------------------------------------
  android-release:
    name: Wallet Android (Release APK)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      # NOTE : pas de keystore configuré ici. L'APK release est donc signé
      # automatiquement avec la clé debug de l'app (installable, mais pas
      # publiable sur le Play Store). Pour une vraie signature de release,
      # voir la section "Pour signer en release" en bas du fichier.
      node: 22.14.0
      java: 17
      # groups:
      #   - wallet_env
      vars:
        PACKAGE_NAME: "com.alex20ng.wallet"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Expo Prebuild (generate android/)
        script: npx expo prebuild --platform android --clean --no-install

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      # Compilation de l'APK release.
      # Sans configuration de signature dédiée, le template Expo signe la
      # release avec la clé debug (résultat installable immédiatement).
      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/**/*.apk

    # Publishing optionnel : notifie par e-mail et joint les artefacts.
    # publishing:
    #   email:
    #     recipients:
    #       - ton.email@example.com
    #     notify:
    #       success: true
    #       failure: true

# =============================================================================
# NOTES / ALTERNATIVES
# -----------------------------------------------------------------------------
# - POUR SIGNER EN RELEASE (vraie clé de distribution) :
#   1) Upload ton keystore dans Codemagic (Reference name = wallet_keystore).
#   2) Dans le workflow android-release, sous `environment`, ajoute :
#        android_signing:
#          - wallet_keystore
#   3) Remplace la commande de compilation par :
#        cd android
#        ./gradlew assembleRelease --no-daemon \
#          -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
#          -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
#          -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
#          -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
#   (l'injection évite d'éditer android/app/build.gradle -> respecte le CNG)
#
# - Build EAS dans le cloud à la place de Gradle : remplace l'étape de
#   compilation par `npx eas-cli build --platform android --profile preview
#   --local --non-interactive` (nécessite EXPO_TOKEN en variable secrète).
#   Le profil "preview" de eas.json produit déjà un APK (buildType: apk).
#
# - Pour un AAB (Google Play) au lieu d'un APK : remplace `assembleRelease`
#   par `bundleRelease` et adapte le chemin d'artefact vers
#   android/app/build/outputs/bundle/release/*.aab
#
# - Si un build échoue à cause d'un SDK Android manquant, ajoute avant la
#   compilation : sdkmanager "platforms;android-36" "build-tools;36.0.0"
# =============================================================================
